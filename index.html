<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

/* ============================================================================
   ART DIRECTION
   Everything worth tuning after a first look lives in this block. Nothing
   below it needs editing to re-grade the piece.
   ========================================================================== */
const CONFIG = {
  // LED backbone — the signature element
  ledColorA:      0xff2ec4,   // hot magenta, rack 1
  ledColorB:      0xc026ff,   // violet, rack 2
  ledIntensity:   2.40,       // emissive multiplier; >1 pushes past bloom threshold
  ledPulsePeriod: 5.4,        // seconds per breathe cycle
  ledPulseDepth:  0.22,       // 0 steady, 1 full on/off
  ledLightPower:  3.30,       // how much the strips actually illuminate geometry

  // cool accent so the palette isn't monochrome magenta
  accentColor:    0x63e6ff,
  accentPower:    1.30,
  screenBrightness: 1.35,     // monitor gain; above ~1.6 the screens blow out

  // patch cabling
  patchCableLength: 0.1524,   // 6 inches — the bow is solved to match this
  patchCableRadius: 0.0027,
  patchCableColor:  0x6d4fb0, // purple, per the install
  patchCableSwing:  0.038,    // lateral swing; this is what makes them overlap

  // camera
  orbitPeriod:    34.0,       // seconds per full drift cycle
  orbitAmplitude: 0.150,      // radians of yaw sweep
  orbitRise:      0.085,      // metres of vertical bob
  orbitRadius:    3.20,
  parallaxAmount: 0.045,      // mouse influence; 0 disables
  fov:            36,

  // post
  exposure:       2.4,
  bloomStrength:  1.30,
  bloomThreshold: 0.82,       // emissive mask: lit geometry sits below this
  bloomKnee:      0.35,
  dofFocus:       3.05,       // metres — lands on the patch field
  dofRange:       1.70,
  dofMaxRadius:   3.4,        // pixels at 1080p-equivalent
  chromaticAberration: 0.0024,
  grainAmount:    0.0,
  vignette:       0.0,
  blackCrush:     0.0,

  maxPixelRatio:  1.5,

  // audio-reactive spin + light show, driven by the OIIA click (see AUDIO VIZ)
  audioBeatSensitivity: 1.35,  // bass must exceed (rolling avg * this) to count as a beat
  audioBeatFloor:       0.16,  // and clear this absolute noise floor (0..1)
  audioBeatMinInterval: 0.20,  // seconds; caps detection at ~300bpm
  audioSpinKick:        3.2,   // rad/s added to spin velocity per click, before the first beat lands
  audioSpinImpulse:     5.0,   // rad/s added to spin velocity per detected beat
  audioSpinDrive:       2.6,   // rad/s^2 continuous push from overall energy, on top of beat kicks
  audioSpinDrag:        1.8,   // 1/s exponential decay on spin velocity
  audioFlashDecay:      7.0,   // 1/s decay of the per-beat light flash
  audioBloomBoost:      2.8,   // extra bloomStrength at full flash
  audioExposureBoost:   0.85,  // extra exposure at full flash
  audioStrobeColors: [0xff2ec4, 0xc026ff, 0xff36e0, 0x9b30ff, 0xff0090, 0x7a1fff]
};

/* ============================================================================
   BOOT / CAPABILITY
   ========================================================================== */
const canvas = document.getElementById('scene-canvas');
const veil   = document.getElementById('veil');
const bgScrim = document.getElementById('bg-scrim');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer = new THREE.WebGLRenderer({
  canvas: canvas, antialias: true, powerPreference: 'high-performance', stencil: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.setClearColor(0x05040a, 1);
renderer.toneMapping = THREE.NoToneMapping;      // ACES applied in the composite pass
renderer.outputEncoding = THREE.LinearEncoding;  // sRGB conversion is manual, at the end

const isWebGL2   = renderer.capabilities.isWebGL2;
const hasDepthTex = isWebGL2 || !!renderer.extensions.get('WEBGL_depth_texture');
const canHalfLinear = isWebGL2 || !!renderer.extensions.get('OES_texture_half_float_linear');
const RT_TYPE = canHalfLinear ? THREE.HalfFloatType : THREE.UnsignedByteType;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x07030c, 0.01);

const camera = new THREE.PerspectiveCamera(CONFIG.fov, window.innerWidth / window.innerHeight, 0.1, 60);
const clock = new THREE.Clock();

/* ============================================================================
   DIMENSIONS
   ========================================================================== */
const U       = 0.04445;          // one rack unit in metres
const PANEL_W = 0.4826;           // 19 inches
const RACK_D  = 0.78;
const FRONT_Z = RACK_D / 2;       // front plane of the frame
const PANEL_Z = FRONT_Z - 0.018;  // recessed face of installed gear

function uY(u, h) { return (u - 1) * U + (h * U) / 2; }

function rand(ref) {              // deterministic per-rack variation
  ref.s = (ref.s * 1664525 + 1013904223) % 4294967296;
  return ref.s / 4294967296;
}

/* Merge indexed geometries into one buffer. BufferGeometryUtils lives in
   examples/jsm and isn't available from the CDN build, and a few hundred
   individual cable meshes would be a few hundred draw calls. */
function mergeGeos(list) {
  let vCount = 0, iCount = 0;
  list.forEach(function (g) {
    vCount += g.attributes.position.count;
    iCount += g.index.count;
  });

  const pos = new Float32Array(vCount * 3);
  const nor = new Float32Array(vCount * 3);
  const uv  = new Float32Array(vCount * 2);
  const idx = vCount > 65535 ? new Uint32Array(iCount) : new Uint16Array(iCount);

  let vo = 0, io = 0;
  list.forEach(function (g) {
    pos.set(g.attributes.position.array, vo * 3);
    nor.set(g.attributes.normal.array, vo * 3);
    uv.set(g.attributes.uv.array, vo * 2);
    const gi = g.index.array;
    for (let i = 0; i < gi.length; i++) idx[io + i] = gi[i] + vo;
    vo += g.attributes.position.count;
    io += gi.length;
    g.dispose();
  });

  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal',   new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv',       new THREE.BufferAttribute(uv, 2));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  out.computeBoundingSphere();
  return out;
}

/* ============================================================================
   PORT LAYOUT
   Shared by the canvas texture drawing and the LED placement, so every glow
   lands exactly on a jack. Coordinates are normalised 0..1 across the face.
   ========================================================================== */
function portLayout(type) {
  const ports = [];

  if (type === 'patch') {
    // 48 port, two rows of 24, on the SAME pitch as the switch face so port N
    // sits directly above port N and the patch cables run straight adjacent
    const zones = [
      { n: 12, c: [0.13, 1.00, 0.42] },   // wireless — green
      { n: 12, c: [0.24, 0.62, 1.00] },   // data — blue
      { n: 8,  c: [1.00, 0.52, 0.10] },   // AV — orange
      { n: 8,  c: [1.00, 0.20, 0.24] },   // security — red
      { n: 8,  c: [0.72, 0.40, 1.00] }    // misc — purple
    ];
    const cols = [];
    zones.forEach(function (z) { for (let k = 0; k < z.n; k++) cols.push(z.c); });

    const pw = 0.0255, gap = 0.0065, x0 = 0.035;
    for (let i = 0; i < 48; i++) {
      const r = i < 24 ? 0 : 1, k = i % 24;
      ports.push({
        x: x0 + k * (pw + gap) + pw / 2,
        y: r === 0 ? 0.30 : 0.70,
        w: pw, h: 0.30, c: cols[i]
      });
    }

  } else if (type === 'switch') {
    const pw = 0.0255, gap = 0.0065, x0 = 0.035;
    for (let r = 0; r < 2; r++) {
      for (let k = 0; k < 24; k++) {
        ports.push({
          x: x0 + k * (pw + gap) + pw / 2,
          y: r === 0 ? 0.30 : 0.70,
          w: pw, h: 0.30, c: [0.20, 1.00, 0.36]
        });
      }
    }
    for (let k = 0; k < 4; k++) {
      ports.push({ x: 0.822 + k * 0.030, y: 0.5, w: 0.026, h: 0.44, c: [1.00, 0.72, 0.16] });
    }

  } else if (type === 'fiber') {
    for (let k = 0; k < 12; k++) {
      ports.push({
        x: 0.115 + k * 0.0645, y: 0.5, w: 0.046, h: 0.44,
        c: k % 3 === 0 ? [1.00, 0.68, 0.18] : [0.30, 1.00, 0.52]
      });
    }

  } else if (type === 'oob') {
    for (let k = 0; k < 16; k++) {
      ports.push({ x: 0.30 + k * 0.027, y: 0.5, w: 0.019, h: 0.34,
                   c: [0.24, 0.94, 0.58], small: true });
    }

  } else if (type === 'core') {
    for (let k = 0; k < 24; k++) {              // SFP28 cages
      ports.push({ x: 0.048 + k * 0.0315, y: 0.5, w: 0.026, h: 0.46,
                   c: k % 4 === 3 ? [1.00, 0.70, 0.20] : [0.22, 1.00, 0.44] });
    }
    for (let k = 0; k < 4; k++) {               // QSFP uplinks
      ports.push({ x: 0.835 + k * 0.040, y: 0.5, w: 0.034, h: 0.54,
                   c: [1.00, 0.62, 0.16] });
    }

  } else if (type === 'copper') {
    // inter-rack copper patch panel — passive, so the indicators stay dim
    const pw = 0.0305, gap = 0.0085, total = 24;
    const span = total * pw + (total - 1) * gap;
    let x = (1 - span) / 2;
    for (let k = 0; k < total; k++) {
      ports.push({ x: x + pw / 2, y: 0.42, w: pw, h: 0.46, c: [0.66, 0.80, 0.96], dim: true });
      x += pw + gap;
    }

  } else if (type === 'isp') {
    for (let k = 0; k < 3; k++) {          // carrier status lamps
      ports.push({ x: 0.082 + k * 0.024, y: 0.42, w: 0.014, h: 0.10,
                   c: [0.30, 1.00, 0.45], dot: true });
    }
    for (let k = 0; k < 8; k++) {          // handoff ports
      ports.push({ x: 0.605 + k * 0.038, y: 0.5, w: 0.029, h: 0.42, c: [0.24, 0.92, 0.52] });
    }

  } else if (type === 'firewall') {
    for (let k = 0; k < 10; k++) {
      ports.push({ x: 0.34 + k * 0.034, y: 0.52, w: 0.026, h: 0.38,
                   c: k < 6 ? [0.22, 1.00, 0.44] : [1.00, 0.74, 0.22] });
    }

  } else if (type === 'nas') {
    ports.push({ x: 0.100, y: 0.88, w: 0.012, h: 0.05, c: [0.30, 0.62, 1.00], dot: true });
    ports.push({ x: 0.134, y: 0.88, w: 0.012, h: 0.05, c: [0.85, 0.95, 1.00], dot: true });

  } else if (type === 'server') {
    ports.push({ x: 0.860, y: 0.50, w: 0.014, h: 0.16, c: [0.26, 1.00, 0.44], dot: true });
    ports.push({ x: 0.892, y: 0.50, w: 0.014, h: 0.16, c: [1.00, 0.66, 0.18], dot: true });

  } else if (type === 'ups' || type === 'battery') {
    ports.push({ x: 0.780, y: 0.52, w: 0.030, h: 0.10, c: [0.28, 1.00, 0.50], dot: true });
  }

  return ports;
}

/* ============================================================================
   PROCEDURAL TEXTURES
   Front faces are canvas-drawn once per variant and shared between racks.
   Port LEDs are deliberately NOT baked in — they are instanced additive quads
   so they can be lit and animated independently of the albedo.
   ========================================================================== */
const texCache = {};

function brushed(ctx, w, h, base, streaks) {
  ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < streaks; i++) {
    ctx.globalAlpha = 0.03 + Math.random() * 0.05;
    ctx.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#000000';
    ctx.fillRect(0, Math.random() * h, w, 1);
  }
  ctx.globalAlpha = 1;
}

function screws(ctx, w, h) {
  ctx.fillStyle = '#1b1b20';
  [10, w - 10].forEach(function (x) {
    [h * 0.28, h * 0.72].forEach(function (y) {
      ctx.beginPath(); ctx.arc(x, y, Math.min(5, h * 0.09), 0, 6.283); ctx.fill();
    });
  });
}

function makePanelTexture(type, hU) {
  const key = type + '_' + hU;
  if (texCache[key]) return texCache[key];

  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = Math.max(24, Math.round(1024 * (1.75 * hU) / 19));
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;

  if (type === 'ups' || type === 'battery') {
    brushed(ctx, w, h, '#101013', 60);
    const cols = 34, rows = Math.max(3, Math.floor(h / 26));
    const ox = w * 0.06, oy = h * 0.20, sx = (w * 0.62) / cols, sy = (h * 0.60) / rows;
    for (let r = 0; r < rows; r++) {
      for (let k = 0; k < cols; k++) {
        ctx.beginPath();
        ctx.arc(ox + k * sx + (r % 2 ? sx / 2 : 0), oy + r * sy, Math.min(sx, sy) * 0.30, 0, 6.283);
        ctx.fillStyle = '#050506'; ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.055)'; ctx.lineWidth = 1; ctx.stroke();
      }
    }
    if (type === 'ups') {                       // recessed LCD bezel, no legible content
      ctx.fillStyle = '#08080a'; ctx.fillRect(w * 0.72, h * 0.30, w * 0.15, h * 0.40);
      ctx.strokeStyle = 'rgba(255,255,255,0.10)';
      ctx.strokeRect(w * 0.72, h * 0.30, w * 0.15, h * 0.40);
    }
    screws(ctx, w, h);

  } else if (type === 'nas') {
    brushed(ctx, w, h, '#0b0b0e', 40);
    for (let k = 0; k < 8; k++) {               // drive sled seams
      ctx.fillStyle = 'rgba(255,255,255,0.045)';
      ctx.fillRect(w * 0.06, h * (0.10 + k * 0.105), w * 0.60, 1);
    }
    ctx.fillStyle = '#0f0f13'; ctx.fillRect(w * 0.70, h * 0.08, w * 0.24, h * 0.84);
    screws(ctx, w, h);

  } else if (type === 'server') {
    brushed(ctx, w, h, '#131317', 50);
    ctx.fillStyle = '#07070a';
    for (let k = 0; k < 3; k++) ctx.fillRect(w * 0.08, h * (0.22 + k * 0.24), w * 0.62, h * 0.13);
    screws(ctx, w, h);

  } else if (type === 'isp') {
    // carrier demarc — the one pale chassis in the rack, per the elevation
    brushed(ctx, w, h, '#9aa0a8', 45);
    ctx.fillStyle = '#2a2d33';
    ctx.fillRect(w * 0.58, h * 0.18, w * 0.36, h * 0.64);
    portLayout('isp').forEach(function (p) {
      const px = p.x * w, py = p.y * h, pw = p.w * w, ph = p.h * h;
      ctx.fillStyle = '#0b0c0e';
      ctx.fillRect(px - pw / 2, py - ph / 2, pw, ph);
    });
    screws(ctx, w, h);

  } else if (type === 'vent') {
    brushed(ctx, w, h, '#0c0c10', 40);
    for (let k = 0; k < 22; k++) {              // blank / brush panel
      ctx.beginPath();
      ctx.arc(w * 0.06 + k * w * 0.021, h * 0.5, Math.min(h * 0.22, 9), 0, 6.283);
      ctx.fillStyle = '#040405'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.fillStyle = '#1c1d22'; ctx.fillRect(w * 0.55, h * 0.16, w * 0.40, h * 0.68);
    screws(ctx, w, h);

  } else if (type === 'shelf') {                // sliding rack shelf
    brushed(ctx, w, h, '#17171b', 70);
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(0, 0, w, 2);
    ctx.fillStyle = '#0b0b0e'; ctx.fillRect(w * 0.30, h * 0.30, w * 0.40, h * 0.40);
    screws(ctx, w, h);

  } else {
    brushed(ctx, w, h, (type === 'patch' || type === 'copper') ? '#0e0e11' : '#0a0a0d', 55);
    if (type === 'switch') {                    // side vent slots
      ctx.fillStyle = '#07070a';
      for (let k = 0; k < 40; k++) ctx.fillRect(w * 0.955, h * (0.08 + k * 0.021), w * 0.03, 1.5);
    }
    if (type === 'patch') {                     // blank designation strips
      ctx.fillStyle = '#d8d4cc';
      ctx.fillRect(w * 0.035, h * 0.455, w * 0.762, h * 0.055);
      ctx.fillRect(w * 0.82, h * 0.30, w * 0.15, h * 0.40);
    }
    portLayout(type).forEach(function (p) {
      const px = p.x * w, py = p.y * h, pw = p.w * w, ph = p.h * h;
      ctx.fillStyle = '#050507';
      ctx.fillRect(px - pw / 2, py - ph / 2, pw, ph);
      ctx.strokeStyle = 'rgba(190,200,215,0.20)'; ctx.lineWidth = 1;
      ctx.strokeRect(px - pw / 2, py - ph / 2, pw, ph);
      if (!p.dot && !p.small) {                 // jack throat highlight
        ctx.fillStyle = 'rgba(140,155,175,0.10)';
        ctx.fillRect(px - pw / 2 + 1.5, py - ph / 2 + 1.5, pw - 3, ph * 0.22);
      }
    });
    screws(ctx, w, h);
  }

  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  texCache[key] = t;
  return t;
}

function railTexture() {
  if (texCache._rail) return texCache._rail;
  const c = document.createElement('canvas'); c.width = 32; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#131316'; ctx.fillRect(0, 0, 32, 64);
  for (let i = 0; i < 3; i++) {
    const y = 8 + i * 20;
    ctx.fillStyle = '#030304'; ctx.fillRect(11, y, 10, 10);
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.strokeRect(11, y, 10, 10);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, 46);
  t.encoding = THREE.sRGBEncoding;
  texCache._rail = t; return t;
}

function glowTexture() {
  if (texCache._glow) return texCache._glow;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.35)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  texCache._glow = t; return t;
}

function noiseRoughness() {
  if (texCache._rough) return texCache._rough;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(128, 128);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 150 + Math.random() * 80;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 12);
  texCache._rough = t; return t;
}

/* ============================================================================
   RACK 2 MONITOR — simplified Grafana dashboard
   Panel structure follows the real board: ISP status tiles and uptime down the
   left, ISP bandwidth top right, FortiGate HA in the middle, interface in/out
   along the bottom. Carrier names are generic (ISP 1 / ISP 2).
   ========================================================================== */
function makeMonitor() {
  const W = 640, H = 360;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;               // canvas is authored in sRGB

  const F = 'Helvetica Neue, Helvetica, Arial, sans-serif';
  const PINK = [255, 46, 196], ROSE = [240, 73, 159], VIOLET = [168, 85, 247];
  function rgba(c3, a) { return 'rgba(' + c3[0] + ',' + c3[1] + ',' + c3[2] + ',' + a + ')'; }

  // ---- rolling series -------------------------------------------------------
  function mkHist(n, len) {
    const s = [];
    for (let i = 0; i < n; i++) {
      const a = []; for (let k = 0; k < len; k++) a.push(0.3 + Math.random() * 0.3);
      s.push(a);
    }
    return s;
  }
  const ispHist = mkHist(2, 44);
  const inHist  = mkHist(6, 34);
  const outHist = mkHist(6, 34);

  function push(hist, t, seed, lo, spread) {
    for (let i = 0; i < hist.length; i++) {
      const a = hist[i];
      const lvl = lo + (i / Math.max(1, hist.length - 1)) * spread;
      a.shift();
      a.push(Math.max(0.03, Math.min(0.98,
        lvl + 0.09 * Math.sin(t * (0.55 + i * 0.19) + i * 1.7 + seed)
            + (Math.random() - 0.5) * 0.045)));
    }
  }

  // ---- drawing primitives ---------------------------------------------------
  function panel(x, y, w, h, title) {
    ctx.fillStyle = '#16171b'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#25272e'; ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    if (title) {
      ctx.fillStyle = '#c3c7cf'; ctx.font = '500 9px ' + F;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(title, x + 8, y + 14);
    }
  }

  function section(x, y, label) {
    ctx.fillStyle = '#8b9098'; ctx.font = '600 9px ' + F;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('\u2304  ' + label, x, y);
  }

  function chart(x, y, w, h, hist, cols, yLabels, xLabels) {
    ctx.save();
    ctx.strokeStyle = '#212329'; ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const gy = Math.round(y + (h * i) / 4) + 0.5;
      ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); ctx.stroke();
    }
    for (let i = 0; i <= 6; i++) {
      const gx = Math.round(x + (w * i) / 6) + 0.5;
      ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); ctx.stroke();
    }
    // back to front so lower series stay visible
    for (let s = hist.length - 1; s >= 0; s--) {
      const a = hist[s], col = cols[s % cols.length];
      ctx.beginPath(); ctx.moveTo(x, y + h);
      for (let i = 0; i < a.length; i++) {
        ctx.lineTo(x + (w * i) / (a.length - 1), y + h - a[i] * h);
      }
      ctx.lineTo(x + w, y + h); ctx.closePath();
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, rgba(col, 0.42)); g.addColorStop(1, rgba(col, 0.03));
      ctx.fillStyle = g; ctx.fill();

      ctx.beginPath();
      for (let i = 0; i < a.length; i++) {
        const px = x + (w * i) / (a.length - 1), py = y + h - a[i] * h;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = rgba(col, 0.95); ctx.lineWidth = 1.2; ctx.stroke();
    }
    ctx.fillStyle = '#767b85'; ctx.font = '7px ' + F;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    yLabels.forEach(function (l, i) {
      ctx.fillText(l, x - 4, y + (h * i) / (yLabels.length - 1));
    });
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    xLabels.forEach(function (l, i) {
      ctx.fillText(l, x + (w * i) / (xLabels.length - 1), y + h + 4);
    });
    ctx.restore();
  }

  function tile(x, y, w, h, c1, c2, label, value) {
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.font = '500 10px ' + F;
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(label, x + w / 2, y + 20);
    ctx.fillStyle = '#ffffff'; ctx.font = '300 22px ' + F;
    ctx.fillText(value, x + w / 2, y + 48);
  }

  function clock(t, i, n) {
    const secs = Math.floor(t) + i * 30;
    const mm = 47 + Math.floor(secs / 60), ss = secs % 60;
    return '20:' + (mm % 60 < 10 ? '0' : '') + (mm % 60) + ':' + (ss < 10 ? '0' : '') + ss;
  }

  function draw(t) {
    push(ispHist, t, 0.0, 0.55, 0.18);
    push(inHist,  t, 1.3, 0.14, 0.72);
    push(outHist, t, 2.6, 0.11, 0.62);

    ctx.fillStyle = '#0b0c0e'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#131418'; ctx.fillRect(0, 0, W, 15);      // nav strip
    ctx.fillStyle = '#20222a';
    for (let i = 0; i < 5; i++) ctx.fillRect(9 + i * 44, 5, 34, 6);
    ctx.fillRect(W - 96, 5, 40, 6); ctx.fillRect(W - 50, 5, 40, 6);

    const times = [];
    for (let i = 0; i < 7; i++) times.push(clock(t, i, 7));

    // ---- ISP bandwidth --------------------------------------------------
    section(10, 29, 'ISP Bandwidth');
    panel(8, 35, 182, 78, 'ISP Status');
    tile(13, 52, 86, 56, '#ff2f86', '#ff4fb0', 'ISP 1', 'Up');
    tile(101, 52, 84, 56, '#6d18a8', '#a13fd6', 'ISP 2', 'Up');

    panel(8, 118, 182, 56, 'Uptime since July 2026');
    const ug = ctx.createLinearGradient(13, 0, 185, 0);
    ug.addColorStop(0, '#9333ea'); ug.addColorStop(1, '#c084fc');
    ctx.fillStyle = ug; ctx.fillRect(13, 134, 172, 34);
    ctx.fillStyle = '#ffffff'; ctx.font = '300 19px ' + F;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('100.00', 99, 158);

    panel(196, 35, 436, 139, 'ISP Bandwidth');
    chart(240, 50, 384, 94, ispHist, [PINK, VIOLET],
          ['2 Mb/s', '1.50 Mb/s', '1 Mb/s', '500 kb/s', '0 b/s'], times);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    [['ISP 1 Out', PINK], ['ISP 2 Out', VIOLET]].forEach(function (L, i) {
      ctx.strokeStyle = rgba(L[1], 1); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(240 + i * 96, 165); ctx.lineTo(254 + i * 96, 165); ctx.stroke();
      ctx.fillStyle = '#aeb3bb'; ctx.font = '8px ' + F;
      ctx.fillText(L[0], 258 + i * 96, 165);
    });

    // ---- FortiGate HA ---------------------------------------------------
    section(10, 190, 'FortiGate HA');
    panel(8, 196, 182, 66, 'FortiGate HA Mode');
    ctx.fillStyle = '#ff5cc0'; ctx.font = '300 19px ' + F;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('Active-Passive', 99, 240);

    panel(196, 196, 436, 66, 'FortiGate HA Members');
    ctx.font = '8px ' + F; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#7d828b'; ctx.textAlign = 'left';
    ctx.fillText('Member', 206, 224); ctx.fillText('Firewall', 340, 224);
    ctx.textAlign = 'right'; ctx.fillText('Sync', 624, 224);
    ctx.strokeStyle = '#25272e'; ctx.lineWidth = 1;
    [230, 245].forEach(function (gy) {
      ctx.beginPath(); ctx.moveTo(200, gy + 0.5); ctx.lineTo(628, gy + 0.5); ctx.stroke();
    });
    ctx.fillStyle = '#ccd0d6';
    [['fw-1-24', 'fw-1-tor-28'], ['fw-2-24', 'fw-2-tor-28']].forEach(function (r, i) {
      const ry = 241 + i * 15;
      ctx.textAlign = 'left';
      ctx.fillText(r[0], 206, ry); ctx.fillText(r[1], 340, ry);
      ctx.textAlign = 'right'; ctx.fillText('Synced', 624, ry);
    });

    // ---- interface bandwidth --------------------------------------------
    section(10, 278, 'Interface Bandwidth');
    const halfT = times.filter(function (_, i) { return i % 2 === 0; });
    panel(8, 284, 308, 72, 'Bandwidth In (bits/sec)');
    chart(52, 298, 256, 44, inHist, [PINK, ROSE, VIOLET],
          ['8 Mb/s', '4 Mb/s', '0 b/s'], halfT);
    panel(324, 284, 308, 72, 'Bandwidth Out (bits/sec)');
    chart(368, 298, 256, 44, outHist, [PINK, ROSE, VIOLET],
          ['2 Mb/s', '1 Mb/s', '0 b/s'], halfT);

    tex.needsUpdate = true;
  }

  draw(0);
  return { texture: tex, draw: draw };
}

/* Colours here are authored as sRGB hex but this scene feeds a linear
   pipeline (linear render target, ACES + gamma applied once at the very end),
   so every one has to be decoded first. Skipping this is what washed the
   screen out: 0x2d2d36 fed straight through displays at 0.66, not 0.18. */
function dcol(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }

function decodeCar() {
  const raw = atob(CAR_BIN);
  const buf = new ArrayBuffer(raw.length);
  const u8 = new Uint8Array(buf);
  for (let i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);

  // stylised to match the dashboard: magenta body, dark glass, hot lights
  const MATS = [
    new THREE.MeshStandardMaterial({ color: dcol(0xff3ec8), roughness: 0.45, metalness: 0.15,
                                     emissive: dcol(0x2a0620), emissiveIntensity: 0.6,
                                     flatShading: true }),
    new THREE.MeshStandardMaterial({ color: dcol(0x120610), roughness: 0.22, metalness: 0.60 }),
    new THREE.MeshStandardMaterial({ color: dcol(0x0a0a0d), roughness: 0.88, metalness: 0.04 }),
    new THREE.MeshStandardMaterial({ color: dcol(0x6e6e7a), roughness: 0.40, metalness: 0.70 }),
    new THREE.MeshStandardMaterial({ color: dcol(0xfff0d8), roughness: 0.30,
                                     emissive: dcol(0xffcf8a), emissiveIntensity: 0.85 }),
    new THREE.MeshStandardMaterial({ color: dcol(0xff2a5a), roughness: 0.35,
                                     emissive: dcol(0xff0f3c), emissiveIntensity: 0.75 })
  ];

  const root = new THREE.Group();
  const nodes = {};
  CAR_META.forEach(function (m) {
    let grp = nodes[m.n];
    if (!grp) { grp = new THREE.Group(); grp.position.fromArray(m.t); root.add(grp); nodes[m.n] = grp; }

    const q = new Int16Array(buf, m.po, m.nv * 3);
    const pos = new Float32Array(m.nv * 3);
    for (let i = 0; i < m.nv; i++) {
      pos[i * 3]     = m.c[0] + q[i * 3]     / 32767 * m.e[0];
      pos[i * 3 + 1] = m.c[1] + q[i * 3 + 1] / 32767 * m.e[1];
      pos[i * 3 + 2] = m.c[2] + q[i * 3 + 2] / 32767 * m.e[2];
    }
    const n8 = new Int8Array(buf, m.no, m.nv * 3);
    const nor = new Float32Array(m.nv * 3);
    for (let i = 0; i < m.nv * 3; i++) nor[i] = n8[i] / 127;

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('normal',   new THREE.BufferAttribute(nor, 3));
    geo.setIndex(new THREE.BufferAttribute(new Uint16Array(buf, m.io, m.ni).slice(), 1));
    grp.add(new THREE.Mesh(geo, MATS[m.m] || MATS[0]));
  });

  // node 0 is the body; 1-3 are the wheel groups, which spin with road speed
  return { root: root, wheels: [nodes[1], nodes[2], nodes[3]].filter(Boolean) };
}

function roadTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#32323a'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4000; i++) {                 // asphalt tooth
    x.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.035) + ')';
    x.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  x.fillStyle = '#ff3ec8';                         // one dash cycle, three lanes
  [0.18, 0.5, 0.82].forEach(function (u) { x.fillRect(u * 256 - 3, 26, 6, 104); });
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;                 // canvas is authored in sRGB
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, 26);
  return t;
}

function makeCarDashboard() {
  const W = 448, H = 252;
  const rt = new THREE.WebGLRenderTarget(W, H, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat, type: RT_TYPE, depthBuffer: true, stencilBuffer: false
  });
  rt.texture.encoding = THREE.LinearEncoding;

  const sc = new THREE.Scene();
  sc.background = dcol(0x141418);                  // near black, like the real dashboard
  sc.fog = new THREE.Fog(dcol(0x141418), 16, 46);

  const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 120);
  cam.position.set(-3.10, 1.95, 5.60);             // front-quarter, slightly high
  cam.lookAt(0, 0.78, 0.35);

  // total lit-face irradiance lands near 0.8; any more and the body clips to white
  sc.add(new THREE.AmbientLight(dcol(0x6a6a82), 0.25));
  const key = new THREE.DirectionalLight(0xffffff, 0.55); key.position.set(-2, 4, 3);  sc.add(key);
  const rim = new THREE.DirectionalLight(dcol(0xff3ec8), 0.85); rim.position.set(3, 1.6, -3); sc.add(rim);

  const roadTex = roadTexture();
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(16, 80),
    new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.92, metalness: 0.0 })
  );
  road.rotation.x = -Math.PI / 2;
  road.position.z = -20;
  sc.add(road);

  const car = decodeCar();
  sc.add(car.root);

  // speed streaks
  const streakMat = new THREE.MeshBasicMaterial({
    color: dcol(0xff3ec8), transparent: true, opacity: 0.70,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false, fog: false
  });
  const streaks = [];
  for (let i = 0; i < 20; i++) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.035, 1), streakMat);
    s.userData.len = 2.5 + Math.random() * 4.5;
    s.scale.z = s.userData.len;
    s.position.set((Math.random() - 0.5) * 13, 0.12 + Math.random() * 2.6,
                   -34 + Math.random() * 48);
    streaks.push(s); sc.add(s);
  }

  // throughput meter — bars only, no text or logo
  const oScene = new THREE.Scene();
  const oCam = new THREE.OrthographicCamera(0, 1, 1, 0, -1, 1);
  const barGeo = new THREE.PlaneGeometry(1, 1); barGeo.translate(0.5, 0.5, 0);
  function quad(color, op) {
    // depth test off: this composites over a scene whose depth buffer is still bound
    const m = new THREE.Mesh(barGeo, new THREE.MeshBasicMaterial({
      color: dcol(color), toneMapped: false, transparent: true, opacity: op,
      depthTest: false, depthWrite: false
    }));
    oScene.add(m); return m;
  }
  quad(0x0d0d12, 0.85).position.set(0, 0, 0);
  oScene.children[0].scale.set(1, 0.055, 1);
  const track = quad(0x201a26, 0.9);
  track.position.set(0.035, 0.019, 0); track.scale.set(0.93, 0.016, 1);
  const fill = quad(0xff2ec4, 1.0);
  fill.position.set(0.035, 0.019, 0); fill.scale.set(0.2, 0.016, 1);
  const topBar = quad(0x0d0d12, 0.7);
  topBar.position.set(0, 0.955, 0); topBar.scale.set(1, 0.045, 1);

  let dist = 0, tput = 0.5;

  return {
    texture: rt.texture,
    update: function (t, dt) {
      // throughput wanders; everything else is derived from it
      tput = 0.5 + 0.34 * Math.sin(t * 0.23) + 0.13 * Math.sin(t * 0.71 + 1.3);
      tput = Math.max(0.05, Math.min(1, tput));
      const speed = 5 + 30 * tput;                 // m/s

      dist += speed * dt;
      roadTex.offset.y = -dist / 3.08;             // one texture cycle = 3.08 m

      const omega = speed / 0.31;                  // wheel radius 0.31 m
      car.wheels.forEach(function (w) { w.rotation.x += omega * dt; });

      // gentle body settle under acceleration
      car.root.position.y = Math.sin(t * 2.1) * 0.012;
      car.root.rotation.x = -0.004 * tput;

      for (let i = 0; i < streaks.length; i++) {
        const s = streaks[i];
        s.position.z -= speed * dt * 1.35;
        if (s.position.z + s.userData.len < -36) {
          s.position.z = 14 + Math.random() * 8;
          s.position.x = (Math.random() - 0.5) * 13;
          s.position.y = 0.12 + Math.random() * 2.6;
        }
      }
      fill.scale.x = 0.93 * tput;
    },
    render: function () {
      renderer.setRenderTarget(rt);
      renderer.clear();
      renderer.render(sc, cam);
      const prev = renderer.autoClear;
      renderer.autoClear = false;
      renderer.render(oScene, oCam);
      renderer.autoClear = prev;
    }
  };
}

const ledQuad = new THREE.PlaneGeometry(1, 1);
const racks = [];
const m4 = new THREE.Matrix4();

function buildRack(opts) {
  const g = new THREE.Group();
  const seed = { s: opts.seed };
  const rackH = 42 * U + 0.13;
  const bodies = [];
  const ledDefs = [];
  const monitors = [];

  // ---- frame ---------------------------------------------------------------
  const postGeo = new THREE.BoxGeometry(0.048, rackH, 0.048);
  [-1, 1].forEach(function (sx) {
    [-1, 1].forEach(function (sz) {
      const p = new THREE.Mesh(postGeo, matFrame);
      p.position.set(sx * 0.292, rackH / 2, sz * (RACK_D / 2 - 0.024));
      g.add(p);
    });
  });
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.02, RACK_D + 0.06), matFrameWorn);
  base.position.y = 0.01; g.add(base);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.028, RACK_D), matFrame);
  cap.position.y = rackH; g.add(cap);

  // ---- punched rails, visible through the empty U space --------------------
  const railGeo = new THREE.BoxGeometry(0.022, 42 * U, 0.028);
  [-1, 1].forEach(function (sx) {
    const r = new THREE.Mesh(railGeo, matRail);
    r.position.set(sx * 0.252, 21 * U + 0.05, FRONT_Z - 0.05);
    g.add(r);
  });

  // ---- installed gear ------------------------------------------------------
  opts.layout.forEach(function (dev) {
    const y = uY(dev.u, dev.h);
    const hM = dev.h * U - 0.0018;

    if (dev.type === 'empty') return;

    if (dev.type === 'monitor') {
      const plate = new THREE.Mesh(new THREE.BoxGeometry(PANEL_W, hM, 0.05), matBody);
      plate.position.set(0, y, PANEL_Z - 0.03); g.add(plate);

      let monTex;
      if (opts.monitorKind === 'car') {
        monTex = carDash.texture;                 // live render target, updated per frame
      } else {
        const mon = makeMonitor();
        monitors.push(mon);
        monTex = mon.texture;
      }

      const bezel = new THREE.Mesh(new THREE.BoxGeometry(0.472, 0.288, 0.018), matBody);
      bezel.position.set(0, y, PANEL_Z - 0.006); bezel.rotation.x = -0.10; g.add(bezel);

      const screen = new THREE.Mesh(
        new THREE.PlaneGeometry(0.450, 0.2531),
        new THREE.MeshBasicMaterial({
          map: monTex, toneMapped: false, fog: false,
          color: new THREE.Color(CONFIG.screenBrightness,
                                 CONFIG.screenBrightness,
                                 CONFIG.screenBrightness)
        })
      );
      screen.position.set(0, y, PANEL_Z + 0.006); screen.rotation.x = -0.10; g.add(screen);

      const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.458, 0.261), glassMat);
      glass.position.set(0, y, PANEL_Z + 0.009); glass.rotation.x = -0.10; g.add(glass);
      return;
    }

    bodies.push({ y: y, h: hM, d: (dev.type === 'ups' || dev.type === 'battery') ? 0.62 : 0.42 });

    const face = new THREE.Mesh(
      new THREE.PlaneGeometry(PANEL_W, hM),
      new THREE.MeshStandardMaterial({
        map: makePanelTexture(dev.type, dev.h),
        roughness: dev.type === 'patch' ? 0.62 : 0.70,
        metalness: 0.45
      })
    );
    face.position.set(0, y, PANEL_Z + 0.001);
    g.add(face);

    portLayout(dev.type).forEach(function (p) {
      const roll = rand(seed);
      const v = (p.dot || p.small) ? p.y : (p.y - p.h * 0.30);   // LED sits at the jack's top edge
      ledDefs.push({
        x: (p.x - 0.5) * PANEL_W,
        y: y + (0.5 - v) * hM,
        w: p.dot ? 0.006 : Math.min(p.w * PANEL_W * 0.5, 0.012),
        h: p.dot ? 0.005 : 0.006,
        c: p.c,
        mode: (dev.type === 'switch' || dev.type === 'patch') && roll < 0.22 ? 'act'
              : (roll > 0.94 ? 'off' : 'solid'),
        phase: rand(seed) * 100,
        rate:  3.0 + rand(seed) * 14.0,
        base:  p.dim ? 0.20 + rand(seed) * 0.12 : 0.55 + rand(seed) * 0.5
      });
    });
  });

  // ---- chassis bodies: one instanced draw call for the whole rack ----------
  const bodyMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), matBody, bodies.length);
  bodies.forEach(function (b, i) {
    m4.makeScale(PANEL_W - 0.004, b.h, b.d);
    m4.setPosition(0, b.y, PANEL_Z - b.d / 2 - 0.002);
    bodyMesh.setMatrixAt(i, m4);
  });
  bodyMesh.instanceMatrix.needsUpdate = true;
  g.add(bodyMesh);

  // ---- port LEDs: one instanced additive draw call --------------------------
  const ledMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, toneMapped: false, fog: false
  });
  const leds = new THREE.InstancedMesh(ledQuad, ledMat, ledDefs.length);
  const black = new THREE.Color(0, 0, 0);
  ledDefs.forEach(function (d, i) {
    m4.makeScale(d.w, d.h, 1);
    m4.setPosition(d.x, d.y, PANEL_Z + 0.004);
    leds.setMatrixAt(i, m4);
    leds.setColorAt(i, black);
  });
  leds.instanceMatrix.needsUpdate = true;
  leds.frustumCulled = false;
  g.add(leds);

  // ---- the LED backbone on the front posts ---------------------------------
  const STRIP_N = 42;
  const stripMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, toneMapped: false, fog: false
  });
  const strip = new THREE.InstancedMesh(ledQuad, stripMat, STRIP_N * 2);
  const stripDefs = [];
  let si = 0;
  [-1, 1].forEach(function (sx) {
    for (let k = 0; k < STRIP_N; k++) {
      const yy = 0.14 + k * ((rackH - 0.26) / (STRIP_N - 1));
      m4.makeScale(0.022, 0.015, 1);
      m4.setPosition(sx * 0.292, yy, FRONT_Z + 0.007);
      strip.setMatrixAt(si, m4);
      strip.setColorAt(si, black);
      stripDefs.push({ phase: k * 0.16 + (sx > 0 ? 0.8 : 0) });
      si++;
    }
  });
  strip.instanceMatrix.needsUpdate = true;
  strip.frustumCulled = false;
  g.add(strip);

  // ---- specular smear on the floor, standing in for a real reflection ------
  const streaks = [];
  [-1, 1].forEach(function (sx) {
    const s = new THREE.Mesh(
      new THREE.PlaneGeometry(0.17, 2.1),
      new THREE.MeshBasicMaterial({
        map: glowTexture(), transparent: true, blending: THREE.AdditiveBlending,
        depthWrite: false, toneMapped: false, fog: false, opacity: 0.30,
        color: new THREE.Color(opts.tint)
      })
    );
    s.rotation.x = -Math.PI / 2;
    s.position.set(sx * 0.292, 0.006, FRONT_Z + 0.95);
    g.add(s); streaks.push(s);
  });

  // ---- 6" purple patch cables ----------------------------------------------
  // 48 cables per access switch: 24 up to the panel above, 24 down to the panel
  // below, every one landing on the exact adjacent port. Nothing crosses to a
  // different port. The weave is purely a slack problem — a 152 mm cable
  // spanning a 27 mm gap has to put the extra length somewhere, so it swings
  // sideways across its neighbours, and alternating bow depth makes them nest.
  const patchPorts  = portLayout('patch');
  const switchPorts = portLayout('switch');
  const hU = U - 0.0018;
  const cableGeos = [];

  function solveCable(x, yA, yB, over) {
    const swing = CONFIG.patchCableSwing;
    const depth = over ? 1.0 : 0.66;          // over / under, so neighbours interleave
    let lo = 0.002, hi = 0.220, bulge, curve;
    for (let it = 0; it < 8; it++) {          // bisect the bow to hit 6" exactly
      bulge = (lo + hi) / 2;
      curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(x, yA, PANEL_Z + 0.008),
        new THREE.Vector3(x + swing * 0.85, yA + (yB - yA) * 0.25, PANEL_Z + bulge * depth),
        new THREE.Vector3(x + swing * 0.85, yA + (yB - yA) * 0.75, PANEL_Z + bulge * depth),
        new THREE.Vector3(x, yB, PANEL_Z + 0.008)
      ]);
      curve.arcLengthDivisions = 14;
      if (curve.getLength() < CONFIG.patchCableLength) lo = bulge; else hi = bulge;
    }
    return new THREE.TubeGeometry(curve, 14, CONFIG.patchCableRadius, 6, false);
  }

  opts.layout.forEach(function (dev) {
    if (dev.type !== 'switch') return;
    const yS = uY(dev.u, 1);
    let above = null, below = null;
    opts.layout.forEach(function (d) {
      if (d.type !== 'patch') return;
      if (d.u === dev.u + 1) above = d;
      if (d.u === dev.u - 1) below = d;
    });

    for (let k = 0; k < 24; k++) {
      const over = (k % 2) === 0;
      if (above) {                            // switch upper row <- panel lower row
        const sp = switchPorts[k], pp = patchPorts[24 + k];
        cableGeos.push(solveCable((sp.x - 0.5) * PANEL_W,
          uY(above.u, 1) + (0.5 - pp.y) * hU,
          yS + (0.5 - sp.y) * hU, over));
      }
      if (below) {                            // switch lower row -> panel upper row
        const sp = switchPorts[24 + k], pp = patchPorts[k];
        cableGeos.push(solveCable((sp.x - 0.5) * PANEL_W,
          uY(below.u, 1) + (0.5 - pp.y) * hU,
          yS + (0.5 - sp.y) * hU, over));
      }
    }
  });

  if (cableGeos.length) {
    g.add(new THREE.Mesh(mergeGeos(cableGeos), new THREE.MeshStandardMaterial({
      color: CONFIG.patchCableColor, roughness: 0.80, metalness: 0.04   // rubber, not plastic
    })));
  }

  g.position.set(opts.x, 0, opts.z);
  g.rotation.y = opts.rotY;
  bay.add(g);

  racks.push({
    group: g, leds: leds, ledDefs: ledDefs, strip: strip, stripDefs: stripDefs,
    streaks: streaks, monitors: monitors,
    tint: new THREE.Color(opts.tint), phaseOffset: opts.phaseOffset
  });
}

const fsCam   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const RT_OPTS = {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat, type: RT_TYPE, stencilBuffer: false
};

const BLOOM_LEVELS = 4;
let sceneRT = null;
let bloomRT = [];

function allocTargets(w, h) {
  if (sceneRT) sceneRT.dispose();
  bloomRT.forEach(function (p) { p[0].dispose(); p[1].dispose(); });
  bloomRT = [];

  sceneRT = new THREE.WebGLRenderTarget(w, h, Object.assign({ depthBuffer: true }, RT_OPTS));
  if (hasDepthTex) {
    const dt = new THREE.DepthTexture(w, h);
    dt.format = THREE.DepthFormat;
    dt.type = THREE.UnsignedIntType;
    sceneRT.depthTexture = dt;
  }

  let bw = Math.max(2, w >> 1), bh = Math.max(2, h >> 1);
  for (let i = 0; i < BLOOM_LEVELS; i++) {
    const o = Object.assign({ depthBuffer: false }, RT_OPTS);
    bloomRT.push([new THREE.WebGLRenderTarget(bw, bh, o), new THREE.WebGLRenderTarget(bw, bh, o)]);
    bw = Math.max(2, bw >> 1);
    bh = Math.max(2, bh >> 1);
  }
}

const VERT = [
  'varying vec2 vUv;',
  'void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }'
].join('\n');

const brightMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse:  { value: null },
    threshold: { value: CONFIG.bloomThreshold },
    knee:      { value: CONFIG.bloomKnee }
  },
  vertexShader: VERT,
  fragmentShader: [
    'uniform sampler2D tDiffuse;',
    'uniform float threshold;',
    'uniform float knee;',
    'varying vec2 vUv;',
    'void main() {',
    '  vec3 c = texture2D(tDiffuse, vUv).rgb;',
    '  float br = max(c.r, max(c.g, c.b));',
    '  float soft = clamp(br - threshold + knee, 0.0, 2.0 * knee);',
    '  soft = soft * soft / (4.0 * knee + 0.00001);',
    '  float contrib = max(soft, br - threshold) / max(br, 0.00001);',
    '  gl_FragColor = vec4(c * contrib, 1.0);',
    '}'
  ].join('\n'),
  depthTest: false, depthWrite: false
});

const blurMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse:  { value: null },
    direction: { value: new THREE.Vector2(1, 0) },
    texel:     { value: new THREE.Vector2(1 / 512, 1 / 512) }
  },
  vertexShader: VERT,
  fragmentShader: [
    'uniform sampler2D tDiffuse;',
    'uniform vec2 direction;',
    'uniform vec2 texel;',
    'varying vec2 vUv;',
    'void main() {',
    '  vec2 o = direction * texel;',
    '  vec3 s = texture2D(tDiffuse, vUv).rgb * 0.227027;',
    '  s += texture2D(tDiffuse, vUv + o * 1.3846).rgb * 0.316216;',
    '  s += texture2D(tDiffuse, vUv - o * 1.3846).rgb * 0.316216;',
    '  s += texture2D(tDiffuse, vUv + o * 3.2307).rgb * 0.070270;',
    '  s += texture2D(tDiffuse, vUv - o * 3.2307).rgb * 0.070270;',
    '  gl_FragColor = vec4(s, 1.0);',
    '}'
  ].join('\n'),
  depthTest: false, depthWrite: false
});

const compositeMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: null }, tDepth: { value: null },
    tB0: { value: null }, tB1: { value: null }, tB2: { value: null }, tB3: { value: null },
    bloomStrength: { value: CONFIG.bloomStrength },
    resolution: { value: new THREE.Vector2(1, 1) },
    time:       { value: 0 },
    exposure:   { value: CONFIG.exposure },
    focus:      { value: CONFIG.dofFocus },
    focusRange: { value: CONFIG.dofRange },
    maxCoC:     { value: CONFIG.dofMaxRadius },
    caAmount:   { value: CONFIG.chromaticAberration },
    grain:      { value: CONFIG.grainAmount },
    vignette:   { value: CONFIG.vignette },
    crush:      { value: CONFIG.blackCrush },
    camNear:    { value: 0.1 },
    camFar:     { value: 60 },
    useDepth:   { value: hasDepthTex ? 1.0 : 0.0 }
  },
  vertexShader: VERT,
  fragmentShader: [
    'uniform sampler2D tDiffuse;',
    'uniform sampler2D tDepth;',
    'uniform sampler2D tB0;',
    'uniform sampler2D tB1;',
    'uniform sampler2D tB2;',
    'uniform sampler2D tB3;',
    'uniform float bloomStrength;',
    'uniform float exposure;',
    'uniform float focus;',
    'uniform float focusRange;',
    'uniform float maxCoC;',
    'uniform float caAmount;',
    'uniform float grain;',
    'uniform float vignette;',
    'uniform float crush;',
    'uniform float camNear;',
    'uniform float camFar;',
    'uniform float time;',
    'uniform float useDepth;',
    'uniform vec2 resolution;',
    'varying vec2 vUv;',

    'float linearDepth(vec2 uv) {',
    '  float d = texture2D(tDepth, uv).x;',
    '  float z = d * 2.0 - 1.0;',
    '  return (2.0 * camNear * camFar) / (camFar + camNear - z * (camFar - camNear));',
    '}',

    // 7-tap poisson gather, unrolled: GLSL ES 1.00 has no array constructors
    'vec3 gather(vec2 uv, float r, vec2 texel) {',
    '  vec3 s = texture2D(tDiffuse, uv).rgb;',
    '  s += texture2D(tDiffuse, uv + vec2( 0.85,  0.31) * r * texel).rgb;',
    '  s += texture2D(tDiffuse, uv + vec2( 0.14,  0.91) * r * texel).rgb;',
    '  s += texture2D(tDiffuse, uv + vec2(-0.76,  0.52) * r * texel).rgb;',
    '  s += texture2D(tDiffuse, uv + vec2(-0.78, -0.55) * r * texel).rgb;',
    '  s += texture2D(tDiffuse, uv + vec2( 0.10, -0.95) * r * texel).rgb;',
    '  s += texture2D(tDiffuse, uv + vec2( 0.82, -0.44) * r * texel).rgb;',
    '  return s / 7.0;',
    '}',

    'vec3 aces(vec3 x) {',
    '  float a = 2.51;',
    '  float b = 0.03;',
    '  float c = 2.43;',
    '  float d = 0.59;',
    '  float e = 0.14;',
    '  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);',
    '}',

    'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',

    'void main() {',
    '  vec2 uv = vUv;',
    '  vec2 texel = 1.0 / resolution;',
    '  vec2 fromCentre = uv - 0.5;',

    // depth-driven circle of confusion
    '  float coc = 0.0;',
    '  if (useDepth > 0.5) {',
    '    float lz = linearDepth(uv);',
    '    coc = pow(clamp(abs(lz - focus) / focusRange, 0.0, 1.0), 1.4) * maxCoC;',
    '  }',
    '  coc *= resolution.y / 1080.0;',

    '  vec3 base = gather(uv, coc, texel);',

    // lateral chromatic aberration, strongest at the frame edge
    '  float edge = clamp(dot(fromCentre, fromCentre) * 4.0, 0.0, 1.0);',
    '  vec2 caOff = fromCentre * caAmount * edge;',
    '  float rTap = texture2D(tDiffuse, uv + caOff + vec2(0.85, 0.31) * coc * texel).r;',
    '  float bTap = texture2D(tDiffuse, uv - caOff + vec2(-0.78, -0.55) * coc * texel).b;',
    '  base.r = mix(base.r, rTap, edge);',
    '  base.b = mix(base.b, bTap, edge);',

    // bloom chain
    '  vec3 bloom  = texture2D(tB0, uv).rgb * 1.00;',
    '  bloom += texture2D(tB1, uv + caOff * 0.6).rgb * 0.82;',
    '  bloom += texture2D(tB2, uv + caOff * 1.1).rgb * 0.62;',
    '  bloom += texture2D(tB3, uv + caOff * 1.6).rgb * 0.46;',
    '  bloom /= 2.90;',

    '  vec3 col = (base + bloom * bloomStrength) * exposure;',

    // grade: crushed blacks, magenta lifted into the highlights
    '  col = max(col - crush, 0.0) / (1.0 - crush);',
    '  float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));',
    '  col = mix(col, col * vec3(1.06, 0.955, 1.04), smoothstep(0.35, 1.0, luma));',
    '  col = aces(col);',

    '  float v = 1.0 - vignette * dot(fromCentre, fromCentre) * 2.2;',
    '  col *= clamp(v, 0.0, 1.0);',
    '  col += (hash(uv * resolution + fract(time) * 137.0) - 0.5) * grain * (1.0 - luma * 0.55);',

    '  gl_FragColor = vec4(pow(max(col, 0.0), vec3(1.0 / 2.2)), 1.0);',
    '}'
  ].join('\n'),
  depthTest: false, depthWrite: false
});

/* ============================================================================
   RESIZE
   ========================================================================== */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  const pw = Math.max(2, Math.floor(w * dpr));
  const ph = Math.max(2, Math.floor(h * dpr));
  allocTargets(pw, ph);

  compositeMat.uniforms.resolution.value.set(pw, ph);
  compositeMat.uniforms.camNear.value = camera.near;
  compositeMat.uniforms.camFar.value = camera.far;
}
window.addEventListener('resize', resize);
resize();

  flash: 0,                                  // 0..1, spikes on each beat then decays
  spinVel: 0,
  colorFrom: new THREE.Color(CONFIG.ledColorA),
  colorTo:   new THREE.Color(CONFIG.ledColorA),
  colorT: 1,
  colorIdx: 0,
  bassHistory: [],
  lastBeat: -1
};
const strobeScratch = new THREE.Color();

function updateLEDs(t) {
  const strobing = audioViz.active && !reduceMotion;
  if (strobing) strobeScratch.copy(audioViz.colorFrom).lerp(audioViz.colorTo, audioViz.colorT);

  for (let ri = 0; ri < racks.length; ri++) {
    const r = racks[ri];
    const tint = strobing ? strobeScratch : r.tint;

    // breathing backbone, desynced between racks
    const pulse = 1.0 - CONFIG.ledPulseDepth * 0.5 *
      (1.0 - Math.cos((t / CONFIG.ledPulsePeriod) * Math.PI * 2 + r.phaseOffset));
    const k = CONFIG.ledIntensity * pulse * (strobing ? 1.0 + audioViz.flash * 1.4 : 1.0);

    for (let i = 0; i < r.stripDefs.length; i++) {
      // a slow travelling wave stops the strip reading as a solid bar
      const wave = k * (0.86 + 0.14 * Math.sin(t * 1.15 - r.stripDefs[i].phase));
      scratch.setRGB(tint.r * wave, tint.g * wave, tint.b * wave);
      r.strip.setColorAt(i, scratch);
    }
    r.strip.instanceColor.needsUpdate = true;

    r.streaks.forEach(function (s) { s.material.opacity = 0.30 * pulse; });

    const lightBoost = strobing ? 1.0 + audioViz.flash * 1.8 : 1.0;
    stripLights[ri * 2].intensity     = CONFIG.ledLightPower * pulse * lightBoost;
    stripLights[ri * 2 + 1].intensity = CONFIG.ledLightPower * pulse * 0.92 * lightBoost;
    if (strobing) { stripLights[ri * 2].color.copy(tint); stripLights[ri * 2 + 1].color.copy(tint); }
    else if (stripLights[ri * 2].color.getHex() !== r.tint.getHex()) {
      stripLights[ri * 2].color.copy(r.tint); stripLights[ri * 2 + 1].color.copy(r.tint);
    }

    // port activity
    const defs = r.ledDefs;
    for (let i = 0; i < defs.length; i++) {
      const d = defs[i];
      let v;
      if (d.mode === 'off') {
        v = 0.0;
      } else if (d.mode === 'act') {
        // two detuned sines give irregular flicker rather than a metronome
        const s = Math.sin(t * d.rate + d.phase) * Math.sin(t * d.rate * 0.37 + d.phase * 1.7);
        v = s > 0.12 ? d.base * (1.25 + s * 0.5) : d.base * 0.16;
      } else {
        v = d.base * (0.92 + 0.08 * Math.sin(t * 0.8 + d.phase));
      }
      scratch.setRGB(d.c[0] * v, d.c[1] * v, d.c[2] * v);
      r.leds.setColorAt(i, scratch);
    }
    r.leds.instanceColor.needsUpdate = true;
  }
}

function updateCamera(t) {
  const a = reduceMotion ? 0 : Math.sin((t / CONFIG.orbitPeriod) * Math.PI * 2);
  const b = reduceMotion ? 0 : Math.sin((t / CONFIG.orbitPeriod) * Math.PI * 2 + 1.1);
  const yaw  = -0.30 + a * CONFIG.orbitAmplitude + pointer.x * CONFIG.parallaxAmount;
  const rise = 1.34 + b * CONFIG.orbitRise - pointer.y * CONFIG.parallaxAmount * 0.8;

  camera.position.set(
    ORBIT.x + Math.sin(yaw) * CONFIG.orbitRadius,
    rise,
    ORBIT.z + Math.cos(yaw) * CONFIG.orbitRadius
  );
  camera.lookAt(ORBIT.x, ORBIT.y + 0.06, ORBIT.z);
}

function renderPost(t, flash, overall) {
  // 0 — rack 1's screen content, into its own small target
  carDash.render();

  // 1 — beauty pass into the HDR target
  renderer.setRenderTarget(sceneRT);
  renderer.clear();
  renderer.render(scene, camera);

  // 2 — bright extraction at half res
  brightMat.uniforms.tDiffuse.value = sceneRT.texture;
  blit(brightMat, bloomRT[0][0]);

  // 3 — separable blur down the mip chain
  let src = bloomRT[0][0].texture;
  for (let i = 0; i < BLOOM_LEVELS; i++) {
    const a = bloomRT[i][0], b = bloomRT[i][1];
    blurMat.uniforms.texel.value.set(1 / a.width, 1 / a.height);

    blurMat.uniforms.tDiffuse.value = src;
    blurMat.uniforms.direction.value.set(1, 0);
    blit(blurMat, b);

    blurMat.uniforms.tDiffuse.value = b.texture;
    blurMat.uniforms.direction.value.set(0, 1);
    blit(blurMat, a);

    src = a.texture;             // the next level downsamples via its own smaller size
  }

  // 4 — composite to screen
  const u = compositeMat.uniforms;
  u.tDiffuse.value = sceneRT.texture;
  u.tDepth.value   = sceneRT.depthTexture || null;
  u.tB0.value = bloomRT[0][0].texture;
  u.tB1.value = bloomRT[1][0].texture;
  u.tB2.value = bloomRT[2][0].texture;
  u.tB3.value = bloomRT[3][0].texture;
  u.time.value = t;
  u.bloomStrength.value = CONFIG.bloomStrength + (flash || 0) * CONFIG.audioBloomBoost + (overall || 0) * 0.8;
  u.exposure.value = CONFIG.exposure + (flash || 0) * CONFIG.audioExposureBoost;
  blit(compositeMat, null);
}

let booted = false;

// ---- rack spin + light show, triggered by the "Click Me!" button ----------
// Clicking plays the track and, while it's live, a Web Audio analyser drives
// a simple bass-energy beat detector: each detected beat kicks the rack's
// spin velocity (which otherwise just decays) and pops a light-show flash
// that strobes the strip LEDs through the hot-pink/violet palette and blows
// out bloom/exposure for a frame or two. Between beats, overall energy keeps
// a lower continuous spin going so it never fully stops mid-track.
const spinSound = new Audio('/assets/oiia-remix.m4a');
spinSound.preload = 'auto';
const spinBtn = document.getElementById('spin-rack-btn');

let audioCtx = null, analyser = null, freqData = null;
let bassLo = 1, bassHi = 8;   // bin range, recomputed once we know the real sample rate

function ensureAudioGraph() {
  if (audioCtx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;                          // no Web Audio: track still plays, just without the viz
  try {
    audioCtx = new Ctx();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.75;
    freqData = new Uint8Array(analyser.frequencyBinCount);

    const binHz = audioCtx.sampleRate / analyser.fftSize;
    bassLo = Math.max(1, Math.round(20 / binHz));
    bassHi = Math.max(bassLo + 1, Math.round(160 / binHz));

    const src = audioCtx.createMediaElementSource(spinSound);
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
  } catch (e) {
    audioCtx = null; analyser = null;         // e.g. Safari without a user gesture; just skip the viz
  }
}

// Reads the current frequency spectrum, rolls a beat detector over the bass
// band, and updates audioViz (spin velocity, flash, strobe color) from it.
// No-op — leaving audioViz.overall/bass to decay towards 0 — once the track
// stops or the analyser isn't available.
function sampleAudio(t, dt) {
  if (!analyser || spinSound.paused) {
    audioViz.overall *= 0.9; audioViz.bass *= 0.9;
    return;
  }
  analyser.getByteFrequencyData(freqData);

  let bassSum = 0, allSum = 0;
  for (let i = 0; i < freqData.length; i++) allSum += freqData[i];
  for (let i = bassLo; i <= bassHi; i++) bassSum += freqData[i];
  audioViz.overall = allSum / freqData.length / 255;
  audioViz.bass = bassSum / (bassHi - bassLo + 1) / 255;

  const hist = audioViz.bassHistory;
  hist.push(audioViz.bass);
  if (hist.length > 42) hist.shift();          // ~1s of rolling window at 60fps
  const avg = hist.reduce(function (a, b) { return a + b; }, 0) / hist.length;

  const isBeat = audioViz.bass > avg * CONFIG.audioBeatSensitivity &&
                 audioViz.bass > CONFIG.audioBeatFloor &&
                 (t - audioViz.lastBeat) > CONFIG.audioBeatMinInterval;
  if (isBeat) {
    audioViz.lastBeat = t;
    audioViz.flash = 1.0;
    audioViz.spinVel += CONFIG.audioSpinImpulse * (0.6 + audioViz.bass * 0.8);

    audioViz.colorFrom.lerp(audioViz.colorTo, audioViz.colorT);   // freeze at wherever the fade currently is
    const palette = CONFIG.audioStrobeColors;
    let next = Math.floor(Math.random() * palette.length);
    if (next === audioViz.colorIdx) next = (next + 1) % palette.length;
    audioViz.colorIdx = next;
    audioViz.colorTo.set(palette[next]);
    audioViz.colorT = 0;
  }

  audioViz.colorT = Math.min(1, audioViz.colorT + dt * 6);
  audioViz.flash *= Math.exp(-dt * CONFIG.audioFlashDecay);
  audioViz.spinVel += audioViz.overall * CONFIG.audioSpinDrive * dt;
}

if (spinBtn) {
  spinBtn.addEventListener('click', function () {
    ensureAudioGraph();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    spinSound.currentTime = 0;
    spinSound.play().catch(function () {});    // ignore interrupted-play rejections

    audioViz.active = true;
    audioViz.bassHistory.length = 0;
    audioViz.lastBeat = -1;
    audioViz.spinVel += CONFIG.audioSpinKick;
  });
  spinSound.addEventListener('ended', function () {
    audioViz.active = false;
    audioViz.flash = 0;
  });
}

// ---- keep the button on rack 2 when the fixed desktop offset can't be used ----
// Same query as the @media block in the stylesheet. Where it matches, the
// button is placed at the projected screen position of a point on rack 2's
// front face, so it stays on the rack whatever the viewport framing is.
const SPIN_PIN_QUERY = '(max-width: 1023px), (max-aspect-ratio: 1/1), (pointer: coarse)';
const spinPinMQ = window.matchMedia(SPIN_PIN_QUERY);
const SPIN_ANCHOR_Y = uY(42, 1) + 0.09;   // top of rack 2, just under the frame cap: clear of the hero heading on portrait
const SPIN_EDGE_PAD = 8;                  // px kept clear of the screen edge
const spinAnchor = new THREE.Vector3();

function placeSpinBtn() {
  if (!spinBtn) return;
  if (!spinPinMQ.matches) {               // desktop: CSS positions it
    if (spinBtn.style.transform) {
      spinBtn.style.transform = '';
      spinBtn.classList.remove('placed');
    }
    return;
  }
  const rack = racks[1].group;            // the anchor is static: the spin only rotates the rack about its own axis
  spinAnchor.set(rack.position.x, SPIN_ANCHOR_Y, FRONT_Z);
  bay.localToWorld(spinAnchor).project(camera);

  const vw = window.innerWidth, vh = window.innerHeight;
  const half = spinBtn.offsetWidth / 2 + SPIN_EDGE_PAD;
  const x = Math.min(Math.max((spinAnchor.x * 0.5 + 0.5) * vw, half), vw - half);
  const y = (-spinAnchor.y * 0.5 + 0.5) * vh;
  spinBtn.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) translate(-50%,-50%) rotate(-45deg)';
  spinBtn.classList.add('placed');
}

function tick() {
  requestAnimationFrame(tick);
  // getDelta() must come first: getElapsedTime() consumes the delta internally
  const dt = Math.min(clock.getDelta(), 0.05);     // clamped so a stall can't jump the car
  const t = clock.elapsedTime;
  frame++;

  if (!reduceMotion) sampleAudio(t, dt);       // updates audioViz.spinVel/flash/colors from the track

  if (audioViz.spinVel > 0.0005) {
    audioViz.spinVel *= Math.exp(-dt * CONFIG.audioSpinDrag);
    const dAngle = audioViz.spinVel * dt;
    racks.forEach(function (r) { r.group.rotation.y += dAngle; });
  } else {
    audioViz.spinVel = 0;
  }

  pointer.x += (pointer.tx - pointer.x) * 0.035;   // smooth so parallax never snaps
  pointer.y += (pointer.ty - pointer.y) * 0.035;

  if (!reduceMotion) {
    carDash.update(t, dt);
    updateLEDs(t);
    // The Grafana canvas is ~50 text draws plus a 640x360 texture upload, so
    // it runs at 10fps. The car dashboard is a real render target and stays
    // at full rate, since motion there is the whole point.
    if (frame % 6 === 0) {
      racks.forEach(function (r) { r.monitors.forEach(function (m) { m.draw(t); }); });
    }
    hazeSprites.forEach(function (s, i) {
      s.material.opacity = 0.028 + 0.018 * (0.5 + 0.5 * Math.sin(t * 0.21 + i)) +
        (audioViz.active ? audioViz.flash * 0.06 : 0);
    });
    if (audioViz.active) {
      coolLight.color.copy(strobeScratch);
      coolLight.intensity = CONFIG.accentPower * (1.0 + audioViz.flash * 3.0);
    } else {
      if (coolLight.color.getHex() !== CONFIG.accentColor) coolLight.color.set(CONFIG.accentColor);
      coolLight.intensity = CONFIG.accentPower * (0.9 + 0.1 * Math.sin(t * 0.9));
    }
  }

  updateCamera(t);
  renderPost(t, audioViz.active ? audioViz.flash : 0, audioViz.active ? audioViz.overall : 0);
  placeSpinBtn();

  if (bgScrim) {
    bgScrim.style.background = (audioViz.active && audioViz.flash > 0.02)
      ? 'radial-gradient(circle at 50% 32%, rgba(255,45,220,' + (0.22 * audioViz.flash).toFixed(3) +
        ') 0%, rgba(154,48,255,' + (0.14 * audioViz.flash).toFixed(3) + ') 35%, transparent 68%)'
      : 'transparent';
  }

  if (!booted && frame > 2) {
    booted = true;
    veil.classList.add('gone');
    setTimeout(function () { if (veil.parentNode) veil.remove(); }, 1400);
  }
}

// draw one full frame before the loop so the canvas is never empty behind the hero
updateLEDs(0);
updateCamera(0);
renderPost(0);
tick();

})();
</script>

    <div id="root"></div>

    <script>
      (function() {
        let animationStarted = false;
        
        const setupScrollAnimation = () => {
          const animationContainer = document.querySelector('[data-testid="experience-animation-0"]');
          if (!animationContainer) {
            setTimeout(setupScrollAnimation, 100);
            return;
          }
          
          animationContainer.classList.add('animation-paused');
          
          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting && !animationStarted) {
                animationStarted = true;
                animationContainer.classList.remove('animation-paused');
                observer.disconnect();
              }
            });
          }, { threshold: 0.2 });
          
          observer.observe(animationContainer);
        };
        
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setupScrollAnimation);
        } else {
          setupScrollAnimation();
        }
      })();
    </script>
  </body>
</html>
